version: '3'

vars:
  APP_NAME: "fynequery"

tasks:
  default:
    desc: Build the Fyne database client
    cmds:
      - task: build

  build:
    desc: Build the executable
    cmds:
      - go build -o {{.APP_NAME}}.exe .

  run:
    desc: Build and run
    cmds:
      - go run .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run the whole suite under the race detector
    cmds:
      - go test -race -count=1 ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  check:
    desc: The gate a commit should pass - formatting, vet, race tests
    cmds:
      - gofmt -l .
      - task: vet
      - task: test

  tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy
