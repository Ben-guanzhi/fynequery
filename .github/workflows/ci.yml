name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # tableprosql and tableproxlsx come from the tableprosql/v* and
      # tableproxlsx/v* tags on github.com/Ben-guanzhi/TableProGo - there is no
      # replace to a sibling checkout, which is the point: this workflow proves
      # that a bare `git clone` + `go build` produces the app from tags alone.
      # It also needs network access to that repo, so a private fork breaks here
      # unless a token is wired in via git's insteadOf rewrite.
      - name: tablepro-fyne
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...

      - name: go build
        run: go build -o fynequery .

      - name: go.mod stays tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # The dialect table's catalog and window SQL is only truly proven against a
  # server: which column a scanner expects, whether an OFFSET window comes back
  # disjoint, whether a rebuilt name addresses the table, and whether a write
  # the grid queued is accepted, counted and rolled back by the engine whose
  # affected-row rule the "matched no row" guard rests on. internal/db/
  # contract_test.go dials real engines for exactly that, so this job supplies
  # two and sets FYNE_CONTRACT_REQUIRED - with the variable unset the same run
  # would skip six tests and report green.
  #
  # The job runs only ./internal/db: it needs cgo for the SQLite driver but not
  # the GL headers the UI needs, so it stays independent of the build job's
  # system packages.
  contract:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: contract
          MYSQL_DATABASE: fyne_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcontract"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: contract
          POSTGRES_DB: fyne_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      FYNE_CONTRACT_REQUIRED: mysql,postgres
      # The image's health check can go green while MySQL is still on the
      # temporary, networking-disabled server it initializes with, so the dial
      # is retried for this window before the run calls the target broken.
      FYNE_CONTRACT_WAIT_SECONDS: "90"
      FYNE_CONTRACT_MYSQL_HOST: 127.0.0.1
      FYNE_CONTRACT_MYSQL_PORT: "3306"
      FYNE_CONTRACT_MYSQL_USER: root
      FYNE_CONTRACT_MYSQL_PASSWORD: contract
      FYNE_CONTRACT_MYSQL_DATABASE: fyne_contract
      FYNE_CONTRACT_PG_HOST: 127.0.0.1
      FYNE_CONTRACT_PG_PORT: "5432"
      FYNE_CONTRACT_PG_USER: postgres
      FYNE_CONTRACT_PG_PASSWORD: contract
      FYNE_CONTRACT_PG_DATABASE: fyne_contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: catalog contract
        run: go test -count=1 -v -run 'TestContract' ./internal/db
