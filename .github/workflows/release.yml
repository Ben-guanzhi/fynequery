name: release

# Tag a release and the distributables follow: `git tag v1.4.0 && git push --tags`.
# The two things this workflow exists to guarantee are asserted on the artifact
# itself, not assumed from the command line: the binary carries the tag as its
# window-title version, and the Windows binary is a GUI-subsystem image so
# double-clicking it opens a window and not a console.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
            # -H=windowsgui is a Windows link option; handed to a Linux link it
            # fails, so it travels as a matrix value instead of being filtered
            # out with a shell conditional.
            gui_flag: '-H=windowsgui'
            shell: 'msys2 {0}'
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            ext: ''
            gui_flag: ''
            shell: 'bash'
    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT: fynequery-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go-sqlite3 and fyne's GLFW bindings are cgo, so the release needs a real
      # C toolchain per target. The MSYS2 action is how fyne documents building
      # on Windows; note that this step - unlike every other one here - has not
      # been exercised by a run yet, which is why the next step checks for gcc
      # before anything tries to use it.
      - name: Linux build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Windows C toolchain
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Toolchain present
        if: matrix.goos == 'windows'
        shell: ${{ matrix.shell }}
        run: gcc --version

      - name: Build
        shell: ${{ matrix.shell }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -trimpath \
            -ldflags "${{ matrix.gui_flag }} -s -w -X main.appVersion=${GITHUB_REF_NAME}" \
            -o "${ARTIFACT}" .

      # Recorded build settings survive in the binary, so this works on both
      # targets without a strings tool.
      - name: Artifact carries the stamped version
        shell: ${{ matrix.shell }}
        run: go version -m "${ARTIFACT}" | grep -q "${GITHUB_REF_NAME}"

      - name: Windows artifact is a GUI-subsystem image
        if: matrix.goos == 'windows'
        shell: ${{ matrix.shell }}
        run: objdump -p "${ARTIFACT}" | grep -q 'Subsystem.*Windows GUI'

      - name: Size, so a regression in the stripped build is visible
        shell: ${{ matrix.shell }}
        run: ls -l "${ARTIFACT}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # upload-artifact keeps one directory per job; flatten it so the release
      # page shows plain binaries and one checksum file. The side trip through
      # flat/ is what keeps `mv` from being handed a file that already sits in
      # the destination directory.
      - name: Flatten and checksum
        run: |
          mkdir -p flat
          find dist -type f -exec mv -t flat {} +
          mv flat/* dist/
          rmdir flat
          (cd dist && sha256sum fynequery-* > checksums.txt && cat checksums.txt)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: fynequery ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
